[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-combat-engine"
version = "0.1.0"
description = "A customizable, data-driven turn-based combat engine"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
combat-demo = "combat_engine.cli:main"
combat-ui = "combat_engine.web:main"

[tool.setuptools.packages.find]
include = ["combat_engine*"]

[tool.setuptools.package-data]
combat_engine = ["web/*.html", "web/*.css", "web/*.js", "demo.json"]
